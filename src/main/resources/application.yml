spring:
  application:
    name: restaurant-manager-be
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema do Flyway quản lý, Hibernate chỉ kiểm tra
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 2MB

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
    tags-sorter: alpha
    operations-sorter: method
  show-actuator: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
